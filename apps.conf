# Apps that run through the Mullvad VPN namespace. Everything not listed uses the normal LAN.
# Format: name|Menu title|command and arguments   ({conf} = ~/.config/vpn-ns)
# Own Firefox profile + --no-remote: a Firefox already open on the normal LAN is not reused.
firefox|Firefox (Mullvad VPN)|firefox --no-remote --profile {conf}/firefox-profile
